name = "demo-bbird-orders"
main = "index.js"
compatibility_date = "2026-02-16"
account_id = "ac7ee4615628005dc5ba0a22f0aae2a6"

routes = [
   { pattern = "demo.bbird.live/orders", zone_name = "bbird.live" },
]

# Slack goes through the contact-us worker (demo-bbird-contactus), which holds the webhook
services = [
   { binding = "CONTACT_US", service = "demo-bbird-contactus" },
]

# at most 5 orders a minute per visitor (IP)
[[ratelimits]]
name = "ORDER_LIMIT"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[observability.logs]
enabled = true
